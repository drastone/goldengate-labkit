#-- default log props for spark
# Define some default values that can be overridden by system properties
hadoop.root.logger=${OSA_LOG_LEVEL}
hadoop.log.dir=.
hadoop.log.file=hadoop.log
osa.log.app.transports=[{"class":"org.apache.spark.AppMessageKafkaSender","property":{"topic":"","brokers":"localhost:9092","zkurl":"localhost:2181"}}]
osa.log.app.converters=[{"name":"default", "class":"com.oracle.osa.logger.AppMessageDefaultConverter"}]
#osa.log.output.format.simple=[%t] %d %-5level: %msg%n%throwable
osa.log.output.format.simple=%d{yyyy-MM-dd HH:mm:ss} %t %-5p %c{2}:%L - %m%n
osa.log.output.format.txt=[%t] %d %-5level: Pipeline ID:%X{PipelineID} Pipeline Name:%X{PipelineName} Component ID:%X{ComponentID} Instance ID:%X{InstanceID} %msg%n%throwable
osa.log.output.format.json={"Timestamp":"%d{ISO8601}", "Pipeline ID":"%X{PipelineID}", "Pipeline Name":"%X{PipelineName}", "Component ID":"%X{ComponentID}", "Module":"%X{Module}", "Instance ID":"%X{InstanceID}", "User ID":"%X{UserID}", "Message ID":"%X{MSGID}", "Message Args":"%X{MSG_ARGS}" ,"Message Type":"%p", "Message Text":"%m" "Supplemental Attributes":"{"Thread":"%t","class":"%c{1}"}", "Supplemental Detail":"{"stacktrace":""}"}%n
#set debug
log4j.debug=true

# Define the root logger to the system property "hadoop.root.logger".
log4j.rootLogger=${hadoop.root.logger}, EventCounter

# Logging Threshold
log4j.threshold=ALL

# Null Appender
#log4j.appender.NullAppender=org.apache.log4j.varia.NullAppender

# EventCounter appender
log4j.appender.EventCounter=org.apache.hadoop.log.metrics.EventCounter

