# Define some default values that can be overridden by system properties
property.hadoop.root.logger=${OSA_LOG_LEVEL}
property.hadoop.log.dir=.
property.hadoop.log.file=hadoop.log

# Set debug
log4j2.debug=true

# Define the root logger to the system property "hadoop.root.logger".
log4j.rootLogger=${hadoop.root.logger}, EventCounter

# Logging Threshold
log4j.threshold=ALL

# EventCounter appender
log4j.appender.EventCounter=org.apache.hadoop.log.metrics.EventCounter

# Console Appender (Spark default)
appender.console.type=Console
appender.console.name=Console
appender.console.target=SYSTEM_ERR
appender.console.layout.type=PatternLayout
appender.console.layout.pattern=%d{yyyy-MM-dd HH:mm:ss} %t %-5p %c{2}:%L - %m%n

# App Message Appender (commented in original but added for completeness)
# appender.app.type=com.oracle.osa.logger.AppMessageLogger
# appender.app.layout.type=com.oracle.osa.logger.layout.CustomPatternLayout
# appender.app.layout.pattern={"Timestamp":"%d{ISO8601}", "Pipeline ID":"%X{PipelineID}", "Pipeline Name":"%X{PipelineName}", "Component ID":"%X{ComponentID}", "Module":"%X{Module}", "Instance ID":"%X{InstanceID}", "User ID":"%X{UserID}", "Message ID":"%X{MSGID}", "Message Args":"%X{MSG_ARGS}", "Message Type":"%p", "Message Text":"%m", "Supplemental Attributes":"{"Thread":"%t","class":"%c{1}"}", "Supplemental Detail":"{"stacktrace":""}"}%n
# appender.app.transports=[{"class":"org.apache.spark.AppMessageKafkaSender","property":{"topic":"","brokers":"localhost:9092","zkurl":"localhost:2181"}}]
# appender.app.converters=[{"name":"default", "class":"com.oracle.osa.logger.AppMessageDefaultConverter"}]
# appender.app.Threshold=WARN

# Loggers configuration
logger.osa.name=oracle.wlevs.strex.spark.components
logger.osa.level=${OSA_LOG_LEVEL}
logger.osa.appenderRefs=Console
logger.osa.appenderRef.console.ref=Console

logger.sparkengine.name=oracle.wlevs.strex.spark
logger.sparkengine.level=ALL
logger.sparkengine.appenderRefs=Console
logger.sparkengine.appenderRef.console.ref=Console

logger.kafkaImpl.name=oracle.wlevs.strex.kafka.impl
logger.kafkaImpl.level=${OSA_LOG_LEVEL}
logger.kafkaImpl.appenderRefs=Console
logger.kafkaImpl.appenderRef.console.ref=Console

logger.osaLogger.name=com.oracle.osa.logger
logger.osaLogger.level=${OSA_LOG_LEVEL}
logger.osaLogger.appenderRefs=Console
logger.osaLogger.appenderRef.console.ref=Console

logger.osaLoggerConfig.name=com.oracle.osa.logger.config
logger.osaLoggerConfig.level=${OSA_LOG_LEVEL}
logger.osaLoggerConfig.appenderRefs=Console
logger.osaLoggerConfig.appenderRef.console.ref=Console

logger.sparkStreaming.name=org.apache.spark.streaming
logger.sparkStreaming.level=${OSA_LOG_LEVEL}
logger.sparkStreaming.appenderRefs=Console
logger.sparkStreaming.appenderRef.console.ref=Console

logger.SparkCep.name=com.oracle.cep.spark
logger.SparkCep.level=${OSA_LOG_LEVEL}
logger.SparkCep.appenderRefs=Console
logger.SparkCep.appenderRef.console.ref=Console

logger.CepCartridge.name=com.oracle.cep.cartridge
logger.CepCartridge.level=${OSA_LOG_LEVEL}
logger.CepCartridge.appenderRefs=Console
logger.CepCartridge.appenderRef.console.ref=Console

logger.JdbcAdapter.name=com.oracle.cep.adapters.jdbc
logger.JdbcAdapter.level=${OSA_LOG_LEVEL}
logger.JdbcAdapter.appenderRefs=Console
logger.JdbcAdapter.appenderRef.console.ref=Console

# Additional log settings to quiet third-party logs
logger.sparkJetty.name=org.spark-project.jetty
logger.sparkJetty.level=WARN

logger.sparkJettyAbstractLifeCycle.name=org.spark-project.jetty.util.component.AbstractLifeCycle
logger.sparkJettyAbstractLifeCycle.level=ERROR


logger.apacheParquet.name=org.apache.parquet
logger.apacheParquet.level=ERROR

logger.parquet.name=parquet
logger.parquet.level=ERROR

logger.scala.name=scala
logger.scala.level=WARN

# SPARK-9183: Settings to avoid annoying messages when looking up nonexistent UDFs in SparkSQL with Hive support
logger.hiveRetryingHMSHandler.name=org.apache.hadoop.hive.metastore.RetryingHMSHandler
logger.hiveRetryingHMSHandler.level=FATAL

logger.hiveFunctionRegistry.name=org.apache.hadoop.hive.ql.exec.FunctionRegistry
logger.hiveFunctionRegistry.level=ERROR
