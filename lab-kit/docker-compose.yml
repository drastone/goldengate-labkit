# Reader WSL profile: published ports bind to all host interfaces for easy access.
# Use a separate secured override when deploying this Lab Kit on a server.
networks:
  ogg_network:
    ipam:
      driver: default
      config:
#        - subnet: 172.28.1.0/16
        - subnet: 172.28.0.0/16

volumes:
  demo_mysql_data:
  demo_myheat_data:

services:
  oracle_src_23ai:
    container_name: demo_osrc_23ai
    build:
      context: ./oracle/
      dockerfile: Dockerfile23ai
    ulimits:
      nofile:
        soft: 1024
        hard: 65536
    privileged: true
    # --- 리소스 제한 추가 ---
    deploy:
      resources:
        limits:
          cpus: '2.0'         # 최대 CPU 2코어 사용
          memory: 4G          # 최대 메모리 4GB (ORDS 설치 안정권)
        reservations:
          memory: 2G          # 최소 보장 메모리 2GB
    environment:
      - ORACLE_ALLOW_REMOTE=true
      - ORACLE_PASSWORD=WElcome1234##
      #- ORACLE_SID=EAST
      #- ORACLE_CHARACTERSET: AL32UTF8
      #- ENABLE_ARCHIVELOG: true
      #- ENABLE_FORCE_LOGGING: true
    #restart: unless-stopped
    ports:
      - "8521:1521"
      - "5500:5500"
      - "2484:2484"
      - "35081:9080"
      - "35080:8080"
      - "35155:5555"
      - "5760:5560"
      - "5765:5565"
      - "5766:5566"
      - "5768:5568"
      - "5767:5567"
      - "5761:5561" # reserve port
      - "5762:5562" # reserve port
      - "5763:5563" # reserve port
      - "5764:5564" # reserve port
    networks:
         ogg_network:
            ipv4_address: 172.28.0.3
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
