      - "6500:5500"
      - "3484:2484"
      - "36022:22"
      - "36070:50070"
      - "36088:8088"
      - "36988:19888"
      - "36050:5050"
      - "36060:6066"
      - "36077:7077"
      - "36080:8080"
      - "36180:18080"
      - "36081:9080"
