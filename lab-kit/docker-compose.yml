    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
      - ./centos/pkg:/home/oracle/pkg:ro

  # ============================================================
  # MySQL -> HeatWave migration sandbox
  #
  # HeatWave itself is a managed service, not a local Docker image.
  # demo_myheat is a HeatWave-compatible MySQL target profile used
  # for App 101 migration wizard development and offline lab demos.
  # No MySQL port is published to the host by default.
  # ============================================================
  mysql:
    profiles:
      - mysql
    image: mysql:8.4
    container_name: demo_mysql
    command:
      - --server-id=101
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --binlog-row-image=FULL
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
      - --binlog-expire-logs-seconds=604800
      - --local-infile=ON
    environment:
      MYSQL_ROOT_PASSWORD: "WElcome1234##"
      MYSQL_DATABASE: "game"
      MYSQL_USER: "game"
      MYSQL_PASSWORD: "game"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    volumes:
      - demo_mysql_data:/var/lib/mysql
      - ./mysql/source/init:/docker-entrypoint-initdb.d:ro
    networks:
      ogg_network:
        ipv4_address: 172.28.0.31

  myheat:
    profiles:
      - mysql
    image: mysql:8.4
    container_name: demo_myheat
    command:
      - --server-id=201
      - --local-infile=ON
      - --sql-mode=STRICT_TRANS_TABLES,NO_ENGINE_SUBSTITUTION
    environment:
      MYSQL_ROOT_PASSWORD: "WElcome1234##"
      MYSQL_DATABASE: "game_hw"
      MYSQL_USER: "heatwave"
      MYSQL_PASSWORD: "heatwave"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    volumes:
      - demo_myheat_data:/var/lib/mysql
      - ./mysql/heatwave/init:/docker-entrypoint-initdb.d:ro
    networks:
      ogg_network:
        ipv4_address: 172.28.0.32

  # ============================================================
  # Optional Lakehouse: Apache Iceberg + MinIO + Trino
  # ============================================================
  demo_minio:
    profiles:
      - lakehouse
    # MinIO Community images are no longer anonymously pullable from Quay.
    # Pin the archived Bitnami image by digest for this localhost-only lab.
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5@sha256:6dabb4a2088c9a79908de3bc05f4586c23ad2182c8908e7e3acbf61c1467fb20
    container_name: demo_minio
    user: "0"
    ports:
      - "127.0.0.1:38900:9000"
      - "127.0.0.1:38901:9001"
    environment:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=WElcome1234##
      - MINIO_DEFAULT_BUCKETS=warehouse
    volumes:
      - ./iceberg/minio:/bitnami/minio/data
    networks:
      ogg_network:
        ipv4_address: 172.28.0.38

  demo_iceberg_catalog:
    profiles:
      - lakehouse
    image: tabulario/iceberg-rest:0.6.0
    container_name: demo_iceberg_catalog
    ports:
      - "127.0.0.1:38181:8181"
    environment:
      - CATALOG_WAREHOUSE=s3://warehouse/
      - CATALOG_IO__IMPL=org.apache.iceberg.aws.s3.S3FileIO
      - CATALOG_S3_ENDPOINT=http://172.28.0.38:9000
      - CATALOG_S3_ACCESS__KEY__ID=admin
      - CATALOG_S3_SECRET__ACCESS__KEY=WElcome1234##
      - CATALOG_S3_PATH__STYLE__ACCESS=true
      - AWS_ACCESS_KEY_ID=admin
      - AWS_SECRET_ACCESS_KEY=WElcome1234##
      - AWS_REGION=us-east-1
    depends_on:
      - demo_minio
    networks:
      ogg_network:
        ipv4_address: 172.28.0.36

  demo_trino:
    profiles:
      - lakehouse
    image: trinodb/trino:435
    container_name: demo_trino
    ports:
      - "127.0.0.1:38080:8080"
    volumes:
      - ./iceberg/trino/catalog:/etc/trino/catalog
    networks:
      ogg_network:
        ipv4_address: 172.28.0.37
