      - "0.0.0.0:6865:5665"
      - "0.0.0.0:6866:5666"
      - "0.0.0.0:6868:5668"
      - "0.0.0.0:6867:5667"
      - "0.0.0.0:6861:5661" # reserve port
      - "0.0.0.0:6862:5662" # reserve port
